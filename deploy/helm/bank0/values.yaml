image:
  repository: ghcr.io/minhtt159/bank0
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # Only needed for a private registry; the GHCR package is public.
  pullSecrets: []    # e.g. ["ghcr-pull"]

database:
  # Preferred: reference an existing secret holding the DSN.
  existingSecret: ""        # e.g. "bank0-db"
  secretKey: dsn
  # Dev convenience: if existingSecret is empty and this is set, the chart
  # creates a Secret. Do NOT commit a real DSN here.
  dsn: ""                   # postgres://user:pass@host:5432/bank0?sslmode=require

migrations:
  enabled: true             # run `bank0 migrate up` as a pre-upgrade hook Job
  # Requests are mandatory on the target cluster (admission policy). goose applies
  # DDL and waits on the server, so the Job is I/O-bound, not CPU-bound.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

service:
  port: 80

logging:
  # Raise to debug to troubleshoot a live release without rebuilding the image.
  level: info               # debug | info | warn | error
  encoding: json            # json for log collectors; console only for a human tty

admin:
  # NB: the maker-checker threshold + default transfer limit are NOT app config —
  # they live in the DB (bank_settings, API-8) and are edited from the console
  # Settings panel. Only the session idle timeout is an app/infra knob.
  sessionIdleTimeout: 30m

# Trust forwarded client-IP headers (CF-Connecting-IP / X-Forwarded-For) for the
# per-IP auth rate-limit key. Set FALSE if a surface is ever reachable directly —
# a client could then forge the header and rotate the limiter key per request.
#
# X-Forwarded-For is read RIGHT-to-left, trustedProxyHops entries in, because a
# Gateway running with use_remote_address (Envoy, nginx, Traefik) APPENDS the real
# downstream address instead of replacing the header — only the right-most entries
# are proxy-authored. Cloudflare's CF-Connecting-IP is used as-is when present, since
# Cloudflare replaces it outright.
#
# Count every proxy between the client and the pod: 1 for a single in-cluster
# Gateway; 2 for Cloudflare -> tunnel -> Gateway if you rely on XFF there (though
# CF-Connecting-IP makes the count moot on that path).
trustProxyHeaders: true
trustedProxyHops: 1

# Pod- and container-level hardening applied to both deployments. The image is
# distroless:nonroot (uid 65532) and writes nothing to disk, so a read-only root
# filesystem + dropped capabilities are safe.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Prometheus + Grafana integration. Both are OFF by default because they require
# their operators' CRDs to be installed (enabling them otherwise breaks helm
# install). The /metrics endpoint itself is always served by the app.
metrics:
  serviceMonitor:
    enabled: false          # requires the Prometheus Operator (ServiceMonitor CRD)
    interval: 30s
    scrapeTimeout: 10s
    labels: {}              # extra labels so your Prometheus's serviceMonitorSelector matches
  dashboard:
    enabled: false          # ship the Grafana dashboard as a sidecar-discovered ConfigMap
    label: grafana_dashboard  # the kube-prometheus-stack Grafana sidecar label key

# JWT bearer auth for the client (api) surface. Must be shared across all api
# replicas. Prefer an existing secret; the inline value is for dev only. The token
# TTL is an app default (15m, internal/config); override via APP_AUTH_JWT_TTL if needed.
auth:
  existingSecret: ""        # secret holding the JWT signing key
  secretKey: jwt-secret
  jwtSecret: ""             # dev only; if set (and no existingSecret) the chart creates a secret

# Gateway API (Envoy Gateway). HTTPRoutes attach to a Gateway by parentRef.
# The chart can create the Gateway, or set create=false to attach to a shared one.
gateway:
  create: true
  name: bank0
  namespace: ""             # parentRef namespace; defaults to the release namespace
  gatewayClassName: eg      # Envoy Gateway GatewayClass (quickstart uses "eg")
  tls:
    enabled: true
    # cert-manager's gateway-shim provisions a per-host cert into each listener's
    # certificateRefs secret when the Gateway is annotated with this issuer.
    clusterIssuer: letsencrypt-prod
  httpsRedirect: true       # add an HTTP->HTTPS redirect HTTPRoute on the :80 listener

# Client-facing API — scaled for HA.
api:
  exposed: true
  host: api.bank0.hnimn.art
  # Per-surface parentRef override for the api HTTPRoute. Empty fields fall back
  # to the gateway block (name/namespace) and the chart's own listener naming
  # (sectionName https-api, or http when gateway.tls.enabled=false). Those
  # listener names only exist on a chart-created Gateway — attaching to a
  # platform-owned one means using ITS names, e.g.:
  #   gateway: { name: envoy-external, namespace: network, sectionName: https }
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
  # Extra annotations on the api HTTPRoute (e.g. a gatus endpoint definition).
  routeAnnotations: {}
  replicaCount: 3
  runMaintenance: false     # maintenance runs on portal only (advisory-locked)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Progressive delivery via Argo Rollouts + the Gateway API traffic-router
  # plugin. OFF by default: the chart renders a plain Deployment and needs no
  # Argo CRDs. When enabled, the api surface renders a Rollout INSTEAD of the
  # Deployment (never both), plus a second Service (<release>-api-canary) and a
  # canary-aware api HTTPRoute whose two backendRef weights the plugin rewrites
  # (100/0 at rest). Requires: the Argo Rollouts controller with the
  # argoproj-labs/gatewayAPI plugin installed cluster-side, and api.exposed=true
  # — the canary route must be chart-managed, because the plugin rewrites its
  # weights and that object cannot have two owners. Portal stays a Deployment.
  #
  # SCHEMA WARNING: migrations run as a pre-upgrade hook, so a canary runs OLD
  # pods against the NEW schema. Only canary a release whose migrations are
  # backward-compatible — otherwise promote in one step (docs/04-deployment.md §3).
  rollout:
    enabled: false
    # spec.strategy.canary.steps, verbatim. pause: {} (no duration) holds until
    # a human runs `kubectl argo rollouts promote`; pause with a duration
    # resumes on its own. Default: 10% -> hold for a human -> 50% -> short soak
    # -> full.
    steps:
      - setWeight: 10
      - pause: {}
      - setWeight: 50
      - pause:
          duration: 1m
    # spec.strategy.canary.analysis, verbatim — background analysis; set
    # startingStep to skip the first N steps. Empty = manual promotion only.
    # An AnalysisTemplate here must live in the app namespace (or be a
    # ClusterAnalysisTemplate) — Kargo Stage verification templates live in the
    # project namespace, so only cluster-scoped ones can be shared.
    analysis: {}

# Admin portal + operator console.
portal:
  exposed: true
  host: portal.bank0.hnimn.art
  # Per-surface parentRef override for the portal HTTPRoute — same shape and
  # fallbacks as api.gateway (chart default sectionName: https-portal).
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
  # Extra annotations on the portal HTTPRoute.
  routeAnnotations: {}
  replicaCount: 2
  runMaintenance: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
