apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: bank0
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.api.rollout.enabled }}
---
# Canary Service for the api Rollout: the second backendRef the traffic-router
# plugin weights. Same selector as -api at install; the Rollouts controller
# hash-pins both Services to their ReplicaSets during a canary. Deliberately
# NOT carrying app.kubernetes.io/name, so the ServiceMonitor (which matches
# name+instance) skips it — after a rollout finishes both Services select the
# SAME pods, and matching both would scrape every api pod twice, double-counting
# the dashboard's sum(rate(...)). Cost: canary pods aren't scraped during a
# canary; drive analysis from gateway-side metrics, or add a PodMonitor if you
# need per-canary-pod app metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-canary
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-canary
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app.kubernetes.io/name: bank0
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
