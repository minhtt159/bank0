{{- $gwNs := .Values.gateway.namespace | default .Release.Namespace -}}
{{- $tls := .Values.gateway.tls.enabled -}}
{{/* Per-surface parentRef: api/portal.gateway overrides fall back to shared
     gateway block and the chart's own listener naming. A platform Gateway names
     its listeners itself (e.g. "https"), so sectionName must be settable — the
     hardcoded https-api/https-portal only exist on a chart-created Gateway. */}}
{{- $apiGw := .Values.api.gateway | default dict -}}
{{- $portalGw := .Values.portal.gateway | default dict -}}
{{- if .Values.api.exposed }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: bank0
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  {{- with .Values.api.routeAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $apiGw.name | default .Values.gateway.name }}
      namespace: {{ $apiGw.namespace | default $gwNs }}
      sectionName: {{ $apiGw.sectionName | default (ternary "https-api" "http" $tls) }}
  hostnames:
    - {{ .Values.api.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-api
          port: {{ .Values.service.port }}
          {{- if .Values.api.rollout.enabled }}
          # Canary mode: the plugin rewrites these two weights mid-rollout, so
          # Argo CD needs ignoreDifferences on them.
          # Explicit 100/0, not weightless: Gateway API defaults an unspecified
          # weight to 1 — that splits 50/50 before Rollouts ever acts. 100/0 is
          # also the steady state the plugin restores after promotion.
          weight: 100
        - name: {{ .Release.Name }}-api-canary
          port: {{ .Values.service.port }}
          weight: 0
          {{- end }}
{{- end }}
{{- if .Values.portal.exposed }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app.kubernetes.io/name: bank0
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: portal
  {{- with .Values.portal.routeAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $portalGw.name | default .Values.gateway.name }}
      namespace: {{ $portalGw.namespace | default $gwNs }}
      sectionName: {{ $portalGw.sectionName | default (ternary "https-portal" "http" $tls) }}
  hostnames:
    - {{ .Values.portal.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-portal
          port: {{ .Values.service.port }}
{{- end }}
{{/*
  Redirect route: only when the chart OWNS the Gateway (its :80 listener is named
  "http" — a platform Gateway's may not be, and its TLS/redirect policy is not ours
  to set) AND at least one surface is exposed. Without the exposed guard this
  rendered with an EMPTY hostnames list, which matches every host on that listener.
*/}}
{{- if and $tls .Values.gateway.httpsRedirect .Values.gateway.create (or .Values.api.exposed .Values.portal.exposed) }}
---
# HTTP -> HTTPS redirect on the :80 listener for the exposed bank0 hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https-redirect
  labels:
    app.kubernetes.io/name: bank0
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ $gwNs }}
      sectionName: http
  hostnames:
    {{- if .Values.api.exposed }}
    - {{ .Values.api.host | quote }}
    {{- end }}
    {{- if .Values.portal.exposed }}
    - {{ .Values.portal.host | quote }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
