name: Deploy PWA

# The ONE deploy this repo does. The cluster half is still hands-off — it sits
# behind a tunnel and CI has no path to it (see publish.yml) — but the customer
# PWA lives on Cloudflare, which CI can reach, so it ships from here.
#
# Production only, straight from main. No staging environment: the Worker is a
# static host plus an /api proxy with no business logic, so "the front end is a
# commit ahead of the cluster" changes nothing about the ledger. That stops being
# true the day the Worker becomes a token-holding BFF (docs/07 §6) — give it a
# staging Worker then.
#
# Paths-filtered: a change to Go, SQL or the console must not redeploy the edge.
on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "worker/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one in flight: a half-uploaded Worker
# version is not something to race a second upload against.
concurrency:
  group: deploy-pwa
  cancel-in-progress: false

jobs:
  # Same gate publish.yml uses. The PWA's own jobs (webapp, worker, e2e-browser)
  # live in here, so a red suite cannot reach Cloudflare.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Attach the Cloudflare secrets to an environment so the deploy can be given
    # required reviewers later without touching this file.
    environment:
      name: production
      url: https://bank0.hnimn.art
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            worker/package-lock.json

      - name: Build the SPA
        # tsc --noEmit + vite build + the service worker. wrangler uploads
        # web/app/dist via the assets binding, so this must run first.
        run: npm ci && npm run build
        working-directory: web/app

      - name: Install wrangler
        run: npm ci
        working-directory: worker

      - name: Deploy the Worker
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only the shell is asserted. /api/* does reach the cluster now, but it is
      # a different failure domain: a probe through it fails when Postgres is
      # down, when the Access policy or the Worker's service token is missing, or
      # when the cluster is mid-rollout — none of which say anything about the
      # upload that just happened. Keep this check to what this job can break.
      - name: Smoke — the shell is served
        run: |
          code=$(curl -fsS -o /tmp/body -w '%{http_code}' https://bank0.hnimn.art/)
          echo "GET / -> $code"
          grep -q '<div id="app">' /tmp/body || { echo "app root missing from the served shell"; exit 1; }
