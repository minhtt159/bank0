name: Publish

# Artifacts only — there is no CI-driven deploy. The cluster sits behind a
# tunnel and CI has no path to it; the operator runs `helm upgrade` themselves.
#
#   push to main  -> image ghcr.io/minhtt159/bank0:sha-<shortsha>
#   push tag v*   -> image :X.Y.Z + :X.Y  and  chart oci://ghcr.io/minhtt159/charts/bank0
#
# Never `latest`: the target cluster's admission control rejects an unpinned tag,
# and it defeats "what exactly is running?".
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # The gate. ci.yml is workflow_call-able for exactly this: a tag push does not
  # trigger CI on its own (it only runs on branches + PRs), so without this a
  # release could ship code no job ever ran.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # flavor latest=false — see the header.
          flavor: latest=false
          # {{version}} is unprefixed on purpose: the chart defaults image.tag to
          # .Chart.AppVersion ("1.0.0"), so a v-prefixed-only tag set would make
          # the documented `helm install` land in ImagePullBackOff.
          tags: |
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Two arches because the operator develops on arm64 and the cluster's node
      # arch is unconfirmed. The Dockerfile cross-compiles from $BUILDPLATFORM,
      # so this is a second `go build`, not a QEMU-emulated toolchain.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GHCR speaks OCI, so publishing the chart needs no chart-releaser/gh-pages
  # machinery. Tags only: a chart version is a release, not a main push.
  chart:
    # needs: image — a chart pinning an appVersion whose image failed to build is
    # half a release, and the half that is broken installs first.
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # The tag is the release; Chart.yaml must already say the same thing, or
      # the published chart would pin an appVersion nobody tagged.
      - name: Chart version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=$(helm show chart deploy/helm/bank0 | awk '/^version:/ {print $2}')
          app=$(helm show chart deploy/helm/bank0 | awk '/^appVersion:/ {print $2}' | tr -d '"')
          echo "tag=$tag chart version=$chart appVersion=$app"
          [ "$chart" = "$tag" ] && [ "$app" = "$tag" ] || {
            echo "::error::Chart.yaml (version=$chart appVersion=$app) does not match tag $tag — bump it in the release commit"
            exit 1
          }

      - name: Package and push
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          helm package deploy/helm/bank0 --destination /tmp/chart
          helm push /tmp/chart/bank0-*.tgz "$CHART_REGISTRY"

  # The human-facing record. Last, and needs BOTH artifacts: a release that
  # announces an image and a chart before they exist is the same half-release
  # failure the chart job's `needs: image` prevents.
  #
  # Notes come from docs/releases/<tag>.md when that file exists (write the "why"
  # by hand, in the PR that bumps the version); the artifact block and the PR list
  # are appended automatically, so a release is never left without its refs.
  release:
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          CHART: ghcr.io/${{ github.repository_owner }}/charts/bank0
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          # Reruns must not fail the workflow: the release either exists already or
          # this is the first attempt.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — nothing to do"
            exit 0
          fi

          body="$(mktemp)"
          curated="docs/releases/${tag}.md"
          if [ -f "$curated" ]; then
            cat "$curated" >> "$body"
            printf '\n\n' >> "$body"
          else
            echo "::warning::no $curated — publishing with generated notes only"
          fi

          {
            echo '## Artifacts'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Image | \`${IMAGE}:${version}\` — multi-arch \`linux/amd64\` + \`linux/arm64\` |"
            echo "| Chart | \`oci://${CHART}\` version \`${version}\` |"
            echo
            echo '```bash'
            echo "helm install bank0 oci://${CHART} --version ${version} \\"
            echo '  --set database.existingSecret=bank0-db \'
            echo '  --set auth.existingSecret=bank0-auth'
            echo '```'
          } >> "$body"

          # A semver pre-release tag (v1.1.0-rc.1) must not become "latest".
          flags=(--verify-tag --title "$tag" --notes-file "$body" --generate-notes)
          case "$tag" in
            *-*) flags+=(--prerelease) ;;
            *)   flags+=(--latest) ;;
          esac

          gh release create "$tag" "${flags[@]}"
