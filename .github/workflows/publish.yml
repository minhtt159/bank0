name: Publish

# The release lane, and the ONE deploy this repo does.
#
#   push tag v*  -> image ghcr.io/minhtt159/bank0:X.Y.Z + :X.Y
#                   chart oci://ghcr.io/minhtt159/charts/bank0
#                   GitHub release
#                   the customer PWA to bank0.hnimn.art  (final tags only)
#
# A merge publishes nothing — it says the project is stable; the tag says this is
# the version to run. The cluster is behind a tunnel with no path from CI, so the
# operator promotes the chart (docs/04 §3); the PWA is the exception because it
# lives on Cloudflare.
#
# Never `latest`: cluster admission rejects an unpinned tag, and it defeats "what
# exactly is running?".
on:
  push:
    tags: ["v*"]
  # Re-run a tag: `gh workflow run publish.yml --ref vX.Y.Z`. Every job is
  # idempotent, so this doubles as the redeploy button.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # The gate, and on a tag the ONLY one: a tag triggers no CI of its own, so
  # without this call a release could ship and deploy unrun code. Every job below
  # is transitively `needs: ci`.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # flavor latest=false — see the header.
          flavor: latest=false
          # {{version}} unprefixed on purpose: the chart defaults image.tag to
          # .Chart.AppVersion ("1.0.0"), so v-prefixed-only tags would land the
          # documented `helm install` in ImagePullBackOff.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Two arches: the operator develops on arm64, the cluster's node arch is
      # unconfirmed. The Dockerfile cross-compiles from $BUILDPLATFORM, so this is
      # a second `go build`, not QEMU.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GHCR speaks OCI: no chart-releaser/gh-pages machinery needed.
  chart:
    # A chart pinning an appVersion whose image failed to build is half a release,
    # and the broken half installs first.
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Chart.yaml must already match the tag, or the chart pins an appVersion
      # nobody tagged.
      - name: Chart version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=$(helm show chart deploy/helm/bank0 | awk '/^version:/ {print $2}')
          app=$(helm show chart deploy/helm/bank0 | awk '/^appVersion:/ {print $2}' | tr -d '"')
          echo "tag=$tag chart version=$chart appVersion=$app"
          [ "$chart" = "$tag" ] && [ "$app" = "$tag" ] || {
            echo "::error::Chart.yaml (version=$chart appVersion=$app) does not match tag $tag — bump it in the release commit"
            exit 1
          }

      - name: Package and push
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          helm package deploy/helm/bank0 --destination /tmp/chart
          helm push /tmp/chart/bank0-*.tgz "$CHART_REGISTRY"

  # The human-facing record. Last, and needs BOTH artifacts — announcing an image
  # and a chart before they exist is the same half-release failure.
  #
  # Notes come from docs/releases/<tag>.md when it exists (write the "why" by hand
  # in the version-bump PR); the artifact block and PR list are appended.
  release:
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          CHART: ghcr.io/${{ github.repository_owner }}/charts/bank0
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          # Reruns must not fail: the release either exists or this is the first
          # attempt.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — nothing to do"
            exit 0
          fi

          body="$(mktemp)"
          curated="docs/releases/${tag}.md"
          if [ -f "$curated" ]; then
            cat "$curated" >> "$body"
            printf '\n\n' >> "$body"
          else
            echo "::warning::no $curated — publishing with generated notes only"
          fi

          {
            echo '## Artifacts'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Image | \`${IMAGE}:${version}\` — multi-arch \`linux/amd64\` + \`linux/arm64\` |"
            echo "| Chart | \`oci://${CHART}\` version \`${version}\` |"
            echo
            echo '```bash'
            echo "helm install bank0 oci://${CHART} --version ${version} \\"
            echo '  --set database.existingSecret=bank0-db \'
            echo '  --set auth.existingSecret=bank0-auth'
            echo '```'
          } >> "$body"

          # A semver pre-release tag (v1.1.0-rc.1) must not become "latest".
          flags=(--verify-tag --title "$tag" --notes-file "$body" --generate-notes)
          case "$tag" in
            *-*) flags+=(--prerelease) ;;
            *)   flags+=(--latest) ;;
          esac

          gh release create "$tag" "${flags[@]}"

  # The one deploy. Behind image + chart for the same half-release reason the
  # chart is behind image: the Worker for vX must not go live if vX's artifacts
  # do not exist.
  #
  # It does NOT wait for the cluster, and cannot: production is promoted by Kargo
  # plus a human hours or days later (docs/04 §3), invisible to CI. So the PWA for
  # vX serves against api vX-1 for that window. Fine while the Worker is a static
  # host plus an /api proxy with no business logic and the PWA tolerates the
  # previous release's API — both expire when it becomes a token-holding BFF
  # (docs/07 §6), which is also when it earns a staging Worker.
  deploy-pwa:
    needs: [image, chart]
    # Final tags only: a pre-release publishes artifacts but must not touch the
    # production edge. Same hyphen rule the release job uses for --prerelease.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # An environment so the deploy can get required reviewers later without
    # touching this file.
    environment:
      name: production
      url: https://bank0.hnimn.art
    # One at a time, never cancelled in flight: do not race a second upload
    # against a half-uploaded Worker version.
    concurrency:
      group: deploy-pwa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            worker/package-lock.json

      - name: Build the SPA
        # tsc --noEmit + vite build + the service worker. wrangler uploads
        # web/app/dist via the assets binding, so this runs first.
        run: npm ci && npm run build
        working-directory: web/app

      - name: Install wrangler
        run: npm ci
        working-directory: worker

      - name: Deploy the Worker
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke — the edge serves THIS build
        # Stops at the edge on purpose: /api/* answers from the cluster, which can
        # be down, mid-rollout or missing its Access token for reasons unrelated
        # to this upload.
        run: |
          set -euo pipefail

          # Vite hashes bundle names per build, so finding them in the served page
          # proves THIS upload is live, not merely that something answers.
          mapfile -t bundles < <(grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' web/app/dist/index.html | sort -u)
          [ "${#bundles[@]}" -gt 0 ] || {
            echo "::error::built index.html references no hashed bundles — did the build change shape?"; exit 1; }

          # Bounded retry: the first deploy after the switch to `custom_domain` had
          # to wait for Cloudflare to create the DNS record and died on
          # `curl: (6) Could not resolve host` — a green deploy reported red.
          url=https://bank0.hnimn.art/
          for attempt in $(seq 1 12); do
            if code=$(curl -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$url"); then
              if [ "$code" = 200 ] && grep -q '<div id="app">' /tmp/body; then
                stale=0
                for b in "${bundles[@]}"; do
                  grep -qF "$b" /tmp/body || { echo "attempt $attempt: served page has no $b yet"; stale=1; }
                done
                if [ "$stale" = 0 ]; then
                  echo "GET / -> 200, serving this build (attempt $attempt)"
                  exit 0
                fi
              else
                echo "attempt $attempt: HTTP $code"
              fi
            else
              echo "attempt $attempt: curl could not reach the edge yet"
            fi
            sleep 10
          done
          echo "::error::$url did not serve this build within 2 minutes — the upload itself succeeded (see the wrangler step); check Cloudflare before re-running"
          exit 1
