name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish.yml calls this before it ships anything, so a tag can never publish
  # code that hasn't been through the same gates a PR goes through.
  workflow_call:

# Pinned generator versions — keep in lockstep with CLAUDE.md. If these drift,
# the generate-drift gate below will fail with a churned generated file.
env:
  SQLC_VERSION: v1.31.1
  OAPI_CODEGEN_VERSION: v2.7.1
  TEMPL_VERSION: v0.3.1020
  GOOSE_VERSION: v3.27.1

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres for the DB + HTTP integration tests. The tests apply the
    # embedded migrations themselves; they skip unless TEST_DATABASE_DSN is set.
    # Postgres 18 — the only supported version: the schema's `DEFAULT uuidv7()`
    # uses the PG18 built-in.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: bank0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bank0_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_DSN: postgres://admin:admin@localhost:5432/bank0_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (unit + DB/HTTP integration, race detector)
        run: go test -race ./...

  # Contract-first gate: regenerating from the sources must produce no diff, i.e.
  # the committed sqlc / oapi-codegen / templ output is in sync with the spec,
  # queries, migrations, and templates. Drift here is a build error by policy
  # (CLAUDE.md rule 3).
  generate-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}
          go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}

      - name: Regenerate
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          sqlc generate -f db/sqlc.yaml
          oapi-codegen -config api/oapi-codegen.client.yaml api/openapi.yaml
          oapi-codegen -config api/oapi-codegen.admin.yaml api/openapi.yaml
          templ generate

      - name: Fail on drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'task generate' and commit the result." >&2
            exit 1
          fi

  # Worker /api proxy-contract test (docs/specs/spec-e2e-harness.md, Tier B "cheaper
  # intermediate"). Cheap and DB-free — runs the real worker in workerd via
  # @cloudflare/vitest-pool-workers, so it runs per-PR.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # node 24; wrangler >= 4.105 (via vitest-pool-workers 0.18) needs >= 22
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: npm ci
        working-directory: worker
      - name: Proxy-contract test
        run: npm test
        working-directory: worker
      # Typecheck + wrangler dry-run: a broken wrangler.toml or a type error would
      # otherwise surface at deploy time.
      - name: Typecheck + wrangler dry-run
        run: npm run check
        working-directory: worker

  # Customer-PWA unit tests (pure logic: IBAN validation, etc.). Cheap and DB-free,
  # so it gates every PR. The IBAN length table's cross-source drift is guarded
  # separately by a Go test (internal/iban/drift_test.go).
  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web/app
      - name: Unit tests
        run: npm test
        working-directory: web/app
      # The dev server (e2e-browser) transpiles without typechecking, so a TS error
      # or a prod-only build break (PWA plugin, chunking) merged green and first
      # failed at deploy. `npm run build` is tsc --noEmit + vite build.
      - name: Production build
        run: npm run build
        working-directory: web/app

  # Tier A end-to-end: the REAL two-binary split topology (portal + api processes)
  # behind `//go:build e2e`. Go + Postgres only (no browser), so it gates every PR as
  # the regression net for split-mode routing. The browser tier (e2e-browser) gates
  # PRs too, below.
  e2e-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: bank0_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bank0_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://admin:admin@localhost:5432/bank0_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tier A split-mode e2e
        run: go test -tags e2e -count=1 ./internal/e2e/ -v

  # Tier B browser e2e: the customer PWA driven through Playwright against the real
  # api binary + a seeded Postgres (the suite's globalSetup self-manages a throwaway
  # PG via docker). Gates every PR — it was dispatch-only once and silently rotted
  # for weeks (nothing else exercises the PWA against a live backend).
  e2e-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: web/app
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/app/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web/app
      - name: Run Playwright e2e
        run: npx playwright test
        working-directory: web/app
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/app/playwright-report
          retention-days: 7

  # Every migration must be reversible (CLAUDE.md): up -> reset(down all) -> up on
  # a throwaway PG18.

  # The chart is the delivery artifact and its templates change often (admission
  # compliance, env wiring). Without this it was first exercised by the operator's
  # own `helm upgrade` — `helm package` at tag time never renders templates.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint
        run: helm lint deploy/helm/bank0 --set database.existingSecret=x --set auth.existingSecret=y
      - name: Render (default values)
        run: helm template deploy/helm/bank0 --set database.existingSecret=x --set auth.existingSecret=y > /tmp/render.yaml
      - name: Every pod spec is admission-ready
        # The migrate hook Job shipped without resources/automount/securityContext
        # once; the cluster's policies reject that, so every install would fail.
        run: |
          python3 - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/render.yaml')) if d]
          pods = [(d['kind'], d['metadata']['name'], d['spec']['template']['spec'])
                  for d in docs if d['kind'] in ('Deployment', 'Job')]
          assert pods, 'no pod-bearing manifests rendered'
          for kind, name, spec in pods:
              assert spec.get('automountServiceAccountToken') is False, f'{kind}/{name}: SA token automount not disabled'
              assert spec.get('securityContext'), f'{kind}/{name}: no pod securityContext'
              for c in spec['containers']:
                  assert c.get('resources', {}).get('requests'), f'{kind}/{name}/{c["name"]}: no resource requests'
                  assert c.get('securityContext'), f'{kind}/{name}/{c["name"]}: no container securityContext'
                  assert ':latest' not in c['image'], f'{kind}/{name}/{c["name"]}: unpinned image tag'
          print(f'{len(pods)} pod specs OK')
          EOF
