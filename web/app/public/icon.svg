<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- bank0 mark: the blue -> lavender gradient of the console logo and favicon.
       Installed-app icons are baked once, so this is Latte's pair unconditionally —
       maskable, hence the full-bleed background and the text kept inside the
       80% safe zone. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e66f5"/>
      <stop offset="1" stop-color="#7287fd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="50%" y="54%" font-family="system-ui, sans-serif" font-size="200"
        font-weight="800" letter-spacing="-10" fill="#eff1f5"
        text-anchor="middle" dominant-baseline="middle">b0</text>
</svg>
