<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- bank0 mark: same blue -> lavender gradient as .logo in console.css, Catppuccin
       Latte by default and Mocha when the OS prefers dark (tab bars follow the OS). -->
  <style>
    :root { --a:#1e66f5; --b:#7287fd; --ink:#eff1f5; }
    @media (prefers-color-scheme: dark) { :root { --a:#89b4fa; --b:#b4befe; --ink:#1e1e2e; } }
    .bg { fill:url(#g); }
    .t { fill:var(--ink); font:800 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif; letter-spacing:-1px; }
    stop.a { stop-color:var(--a); } stop.b { stop-color:var(--b); }
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient></defs>
  <rect class="bg" x="1" y="1" width="30" height="30" rx="8"/>
  <text class="t" x="16" y="21.5" text-anchor="middle">b0</text>
</svg>
