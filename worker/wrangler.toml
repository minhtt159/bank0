name = "bank0-webapp"
main = "index.ts"
compatibility_date = "2026-01-01"

# Custom domain, not a route: this Worker IS the origin, so Cloudflare owns the
# record and the cert. A route needs a proxied record to already exist, or every
# request is ERR_NAME_NOT_RESOLVED. Top-level key — must precede any [table].
routes = [{ pattern = "bank0.hnimn.art", custom_domain = true }]

# One front door. A preview URL is a public *.workers.dev copy of this Worker
# holding the same Access token, so it would proxy /api/* into the gated API with
# no gate. `preview_urls` defaults to `workers_dev`, which also defaults — state
# both rather than inherit them. The dashboard's `previews_enabled` has no
# equivalent here, which is what the drift warning on every deploy is about.
workers_dev = false
preview_urls = false

# Serve the built SPA. single-page-application returns index.html for unknown
# client routes, so deep links work.
[assets]
directory = "../web/app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# /api/* proxies here so the browser stays same-origin (no CORS). The seam for a
# future token-holding BFF.
[vars]
API_ORIGIN = "https://bank0-api.hnimn.art"

# The Access service token is a secret, not config. Set both halves — dashboard
# Variables and Secrets (Type: Secret), or `wrangler secret put` — either
# publishes a new version without a deploy. The policy is live, so unset means
# every /api/* call is refused at the edge; half-set means index.ts answers
# `500 misconfigured` instead of an Access 403 that points at nothing.
